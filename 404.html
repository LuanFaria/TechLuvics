<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="Página não encontrada — TechLuvics." />
  <link rel="canonical" href="https://tech.luvics.com.br/404.html" />
  <title>Página não encontrada | TechLuvics</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/faviconinstagram.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #22d3ee;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .box { max-width: 28rem; }
    .code {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: clamp(3.5rem, 12vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #22d3ee, #34d399, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); margin-bottom: 1.75rem; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #22d3ee, #34d399);
      color: #000;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }
    a:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code" aria-hidden="true">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou abrir não existe neste site. Volte para a página inicial da TechLuvics.</p>
    <a href="/">Ir para o início</a>
  </div>
</body>
</html>
